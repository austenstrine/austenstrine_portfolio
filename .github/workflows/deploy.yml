name: Deploy to EC2
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"

    - name: Install and build
      run: |
        npm ci
        npm run build

    - name: Deploy
      run: |
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
        chmod 600 private_key
        eval $(ssh-agent -s)
        ssh-add private_key || { echo "ssh-add failed with exit code $?"; exit 1; }
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || { echo "ssh-keyscan failed with exit code $?"; exit 1; }
        tar -C apps/web/out -czf site.tar.gz .
        echo "Deploying to EC2"
        ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
          sudo mkdir -p ${{ secrets.TARGET_DIR }} &&
          sudo chown www-data:www-data ${{ secrets.TARGET_DIR }} &&
          cd ${{ secrets.TARGET_DIR }} &&
          if [ -d .git ]; then
            sudo -u www-data git pull origin master;
          else
            sudo -u www-data rm -rf * &&
            sudo -u www-data git clone https://github.com/austenstrine/austenstrine_portfolio.git .;
          fi
        "
        ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo -u www-data tar -C ${{ secrets.TARGET_DIR }} -xzf -" < site.tar.gz
        ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
          if command -v npm >/dev/null 2>&1; then
            sudo bash ${{ secrets.TARGET_DIR }}/ops/deploy/live.sh || true
          fi
        "
