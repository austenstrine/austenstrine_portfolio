name: Deploy to EC2
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
          eval $(ssh-agent -s)
          ssh-add private_key || { echo "ssh-add failed with exit code $?"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts || { echo "ssh-keyscan failed with exit code $?"; exit 1; }
          # TARGET_DIR = portfolio checkout only (typically /var/www/html).
          # Never /var/www — chown/reset would hit sibling apps (e.g. /var/www/custodian).
          # Contract: docs/ops/custodian-coexistence.md
          echo "Deploying Compose stack to EC2"
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            set -euo pipefail
            TARGET_DIR='${{ secrets.TARGET_DIR }}'
            case \"\$TARGET_DIR\" in
              ''|/var/www|/var/www/)
                echo \"deploy: TARGET_DIR must be a single-app checkout (e.g. /var/www/html), not '\$TARGET_DIR'\" >&2
                exit 1
                ;;
            esac
            sudo mkdir -p \"\$TARGET_DIR\"
            # Repo may have been created as root/www-data; git then refuses 'dubious ownership'.
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} \"\$TARGET_DIR\"
            cd \"\$TARGET_DIR\"
            git config --global --add safe.directory \"\$TARGET_DIR\"
            if [ -d .git ]; then
              git fetch origin master
              git reset --hard origin/master
            else
              git clone https://github.com/austenstrine/austenstrine_portfolio.git .
            fi
            ./ops/deploy/live.sh
          "
