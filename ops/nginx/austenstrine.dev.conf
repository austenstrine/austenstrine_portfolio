# Host nginx alternative when TLS terminates on the Lightsail/EC2 box
# and Compose only runs web + api (+ data). Prefer ops/nginx/nginx.prod.conf
# when nginx is itself a Compose service.

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

upstream austenstrine_web {
	server 127.0.0.1:3000;
}

upstream austenstrine_api {
	server 127.0.0.1:4000;
}

server {
	listen 80;
	server_name austenstrine.dev www.austenstrine.dev;
	return 301 https://austenstrine.dev$request_uri;
}

server {
	listen 443 ssl;
	http2 on;
	server_name austenstrine.dev www.austenstrine.dev;

	# ssl_certificate and ssl_certificate_key stay on the host.

	location /api/ {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_pass http://austenstrine_api;
	}

	location / {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_pass http://austenstrine_web;
	}
}
