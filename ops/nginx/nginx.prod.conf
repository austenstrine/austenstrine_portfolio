worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log /dev/stdout;
	error_log /dev/stderr warn;

	sendfile on;
	keepalive_timeout 65;
	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	upstream frontend_upstream {
		server web:3000;
	}

	upstream backend_upstream {
		server api:4000;
	}

	upstream cdn_upstream {
		server cdn:8088;
	}

	server {
		listen 80;
		server_name austenstrine.dev www.austenstrine.dev;
		return 301 https://austenstrine.dev$request_uri;
	}

	server {
		listen 80;
		server_name cdn.austenstrine.dev;
		return 301 https://cdn.austenstrine.dev$request_uri;
	}

	server {
		listen 443 ssl;
		http2 on;
		server_name austenstrine.dev www.austenstrine.dev;

		# Mount host certs at /etc/nginx/certs on the box.
		# Cert must cover apex (+ www). Prefer the same leaf with a SAN for
		# cdn.austenstrine.dev so the CDN vhost below can reuse these paths;
		# otherwise place cdn.austenstrine.dev.{crt,key} and point the CDN
		# server block at those files.
		ssl_certificate /etc/nginx/certs/austenstrine.dev.crt;
		ssl_certificate_key /etc/nginx/certs/austenstrine.dev.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;

		location /api/ {
			proxy_http_version 1.1;
			proxy_connect_timeout 2s;
			proxy_send_timeout 10s;
			proxy_read_timeout 30s;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_pass http://backend_upstream;
		}

		location / {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_pass http://frontend_upstream;
		}
	}

	# Go CDN (portfolio-cdn). Same cert paths as apex when SAN includes
	# cdn.austenstrine.dev; else swap ssl_certificate* to a CDN-only pair.
	server {
		listen 443 ssl;
		http2 on;
		server_name cdn.austenstrine.dev;

		ssl_certificate /etc/nginx/certs/austenstrine.dev.crt;
		ssl_certificate_key /etc/nginx/certs/austenstrine.dev.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;

		client_max_body_size 32m;

		location / {
			proxy_http_version 1.1;
			proxy_connect_timeout 2s;
			proxy_send_timeout 30s;
			proxy_read_timeout 30s;
			proxy_buffering on;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_pass http://cdn_upstream;
		}
	}
}
