worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;
	access_log /dev/stdout;
	error_log /dev/stderr warn;

	sendfile on;
	keepalive_timeout 65;
	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		'' close;
	}

	# Docker embedded DNS — resolve compose service names at request time
	# so nginx can start even if a sibling is briefly missing.
	resolver 127.0.0.11 ipv6=off valid=10s;

	# Canonical host is www. Apex + bare HTTP → https://www…
	server {
		listen 80;
		server_name austenstrine.dev www.austenstrine.dev;
		return 301 https://www.austenstrine.dev$request_uri;
	}

	server {
		listen 80;
		server_name cdn.austenstrine.dev;
		return 301 https://cdn.austenstrine.dev$request_uri;
	}

	server {
		listen 80;
		server_name crm.austenstrine.dev;
		return 301 https://crm.austenstrine.dev$request_uri;
	}

	server {
		listen 443 ssl;
		http2 on;
		server_name austenstrine.dev;

		ssl_certificate /etc/nginx/certs/austenstrine.dev.crt;
		ssl_certificate_key /etc/nginx/certs/austenstrine.dev.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;

		return 301 https://www.austenstrine.dev$request_uri;
	}

	server {
		listen 443 ssl;
		http2 on;
		server_name www.austenstrine.dev;

		# Mount host certs at /etc/nginx/certs on the box.
		# Cert must cover apex (+ www). Prefer the same leaf with a SAN for
		# cdn.austenstrine.dev so the CDN vhost below can reuse these paths;
		# otherwise place cdn.austenstrine.dev.{crt,key} and point the CDN
		# server block at those files.
		ssl_certificate /etc/nginx/certs/austenstrine.dev.crt;
		ssl_certificate_key /etc/nginx/certs/austenstrine.dev.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;

		location /api/ {
			proxy_http_version 1.1;
			proxy_connect_timeout 2s;
			proxy_send_timeout 10s;
			proxy_read_timeout 30s;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			set $backend_upstream api:4000;
			proxy_pass http://$backend_upstream;
		}

		location / {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			set $frontend_upstream web:3000;
			proxy_pass http://$frontend_upstream;
		}
	}

	# Admin CRM (portfolio-crm). Prefer a leaf SAN for crm.austenstrine.dev
	# on the same cert paths as apex; otherwise point ssl_certificate* at a
	# CRM-only pair under /etc/nginx/certs.
	server {
		listen 443 ssl;
		http2 on;
		server_name crm.austenstrine.dev;

		ssl_certificate /etc/nginx/certs/austenstrine.dev.crt;
		ssl_certificate_key /etc/nginx/certs/austenstrine.dev.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;

		location /api/ {
			proxy_http_version 1.1;
			proxy_connect_timeout 2s;
			proxy_send_timeout 10s;
			proxy_read_timeout 30s;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			set $backend_upstream api:4000;
			proxy_pass http://$backend_upstream;
		}

		location / {
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			set $crm_upstream crm:3001;
			proxy_pass http://$crm_upstream;
		}
	}

	# Go CDN (portfolio-cdn). Same cert paths as apex when SAN includes
	# cdn.austenstrine.dev; else swap ssl_certificate* to a CDN-only pair.
	server {
		listen 443 ssl;
		http2 on;
		server_name cdn.austenstrine.dev;

		ssl_certificate /etc/nginx/certs/austenstrine.dev.crt;
		ssl_certificate_key /etc/nginx/certs/austenstrine.dev.key;
		ssl_protocols TLSv1.2 TLSv1.3;
		ssl_ciphers HIGH:!aNULL:!MD5;

		client_max_body_size 32m;

		location / {
			proxy_http_version 1.1;
			proxy_connect_timeout 2s;
			proxy_send_timeout 30s;
			proxy_read_timeout 30s;
			proxy_buffering on;
			proxy_set_header Host $host;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Real-IP $remote_addr;
			set $cdn_upstream cdn:8088;
			proxy_pass http://$cdn_upstream;
		}
	}
}
