# Fail2ban filter — Custodian Asterisk auth / unidentified floods (GSSA-100).
# No secrets in matched lines. Tune if Asterisk log wording changes.

[Definition]
failregex = ^(?:\[\])?\s*(?:\S+ )?(?:NOTICE|WARNING|SECURITY|ERROR).* (?:No matching endpoint found|Failed to authenticate|Rejection due to unidentified source|Wrong password|No auth matches)(?:.*)$
ignoreregex =
