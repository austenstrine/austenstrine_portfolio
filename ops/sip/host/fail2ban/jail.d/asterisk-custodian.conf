# Optional host jail. Prefer rate-limit + auth over IP ACL-only (kid phone dynamic IP).
# Enable only after logpath points at real Asterisk messages (docker logs or bind-mount).

[asterisk-custodian]
enabled = false
filter = asterisk-custodian
# Example: docker logs → file, or bind-mount /var/log/asterisk/messages
logpath = /var/log/asterisk/messages
backend = auto
maxretry = 8
findtime = 600
bantime = 3600
# Do not ban loopback / docker bridge blindly — leave action default iptables-multiport
port = 5060,8088
protocol = all
