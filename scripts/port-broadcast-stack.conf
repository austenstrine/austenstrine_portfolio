# Portfolio local stack — 6 Terminal tabs via port-broadcast-launcher.
# Titles use dssh target aliases; ports stay for agent `nc` attach.
#
# Dry-run:
#   ./scripts/port-broadcast-launcher --dry-run --config ./scripts/port-broadcast-stack.conf --confirm
# Launch (GUI; needs --confirm):
#   ./scripts/port-broadcast-launcher --config ./scripts/port-broadcast-stack.conf --confirm

tabs=6
base-port=4591
bind=127.0.0.1

alias.1=rlog
alias.2=proxy
alias.3=cdn
alias.4=backend
alias.5=frontend
alias.6=crm

tab.1=cd /home/austen-loren-strine/Development/austenstrine_portfolio && ./dssh rlog; ./dssh logs rlog
tab.2=cd /home/austen-loren-strine/Development/austenstrine_portfolio && ./dssh proxy restart; ./dssh logs proxy
tab.3=cd /home/austen-loren-strine/Development/austenstrine_portfolio && ./dssh cdn restart; ./dssh logs cdn
tab.4=cd /home/austen-loren-strine/Development/austenstrine_portfolio && ./dssh backend restart; ./dssh logs backend
tab.5=cd /home/austen-loren-strine/Development/austenstrine_portfolio && ./dssh frontend restart; ./dssh logs frontend
tab.6=cd /home/austen-loren-strine/Development/austenstrine_portfolio && ./dssh crm restart; ./dssh logs crm
